spring:
  application:
    name: info-platform-backend
  datasource:
    # URL 参数传三条 PRAGMA：xerial sqlite-jdbc 把 ?key=value 转为 PRAGMA key=value 执行。
    # 经实测 HikariCP connection-init-sql 对 ';' 分隔多语句只执行首条（foreign_keys/busy_timeout 不生效），
    # 故 WAL/外键/写锁等待改用 URL 参数，连接即开三件 PRAGMA。
    url: jdbc:sqlite:file:./data/info-platform.db?journal_mode=WAL&foreign_keys=on&busy_timeout=5000
    driver-class-name: org.sqlite.JDBC
    hikari:
      # SQLite 单写者模型：小池即可（1~5），写靠排队不靠加池
      maximum-pool-size: 5
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

# MyBatis-Plus 配置
mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      id-type: AUTO

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info

# 数据源 adapter 切换：mock（T09 骨架）默认开启；T03~T08 真实 adapter 落地后设 false 切换
adapter:
  mock:
    enabled: true
  # 东方财富行情源（T03）：端点 URL 与 f 字段列表可配，不硬编码全 URL
  eastmoney:
    quote-url: https://push2.eastmoney.com/api/qt/stock/get
    fields: f43,f44,f45,f46,f47,f48,f57,f58,f60,f168,f169,f170,f171

# 聚合编排总超时（2s 预算，各 adapter 弹性超时级联收敛，对齐技术方案 §4.3 流程 1）
aggregation:
  detail-timeout-millis: 2000
