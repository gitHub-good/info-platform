spring:
  application:
    name: info-platform-backend
  datasource:
    # URL 参数传三条 PRAGMA：xerial sqlite-jdbc 把 ?key=value 转为 PRAGMA key=value 执行。
    # 经实测 HikariCP connection-init-sql 对 ';' 分隔多语句只执行首条（foreign_keys/busy_timeout 不生效），
    # 故 WAL/外键/写锁等待改用 URL 参数，连接即开三件 PRAGMA。
    url: jdbc:sqlite:file:./data/info-platform.db?journal_mode=WAL&foreign_keys=on&busy_timeout=5000
    driver-class-name: org.sqlite.JDBC
    hikari:
      # SQLite 单写者模型：小池即可（1~5），写靠排队不靠加池
      maximum-pool-size: 5
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

# MyBatis-Plus 配置
mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      id-type: AUTO

server:
  port: 8080

# 认证（T17）：JWT HS256 + 本地用户表 + 登录限流（对齐技术方案 §5 安全、backend.md「认证」段）
# 密钥走环境变量 ${JWT_SECRET} 注入，生产缺失即 fail-fast（JwtTokenService 构造校验非空且 >=32 字节）。
# 限流按 ip+username 组合，窗口内失败达阈值锁定。
security:
  jwt:
    secret: ${JWT_SECRET}
    access-token-ttl: PT1H        # access 令牌有效期（短期，对齐 §5「JWT 短期 1h」）
    refresh-token-ttl: P7D         # refresh 令牌有效期（7 天）
  login-rate-limit:
    window: PT1M                  # 失败计数窗口（1 分钟）
    threshold: 5                  # 窗口内失败次数阈值（5 次触发锁定）
    lock-duration: PT5M           # 触发阈值后锁定时长（5 分钟）

management:
  endpoints:
    web:
      exposure:
        include: health,info

# 配置中心（T34，ADR-0017/0018）：CONFIG_SECRET 为 runtime_config 中 API key 密文的主密钥（AES-256-GCM）。
# 可选环境变量：未配置不阻断启动，key 写入功能降级（写接口 30064，key 继续走环境变量）；
# 配置但 <32 字节启动 fail-fast（与 JWT_SECRET 同策略）。轮换会使已存密文不可解，需在页面重新录入 key。
config:
  secret: ${CONFIG_SECRET:}

# 数据源 adapter 切换：mock（T09 骨架）默认开启；T03~T08 真实 adapter 落地后设 false 切换
adapter:
  mock:
    enabled: true
  # 东方财富源：端点 URL 与字段列表可配，不硬编码全 URL
  eastmoney:
    # 行情源（T03）：push2 stock/get
    quote-url: https://push2.eastmoney.com/api/qt/stock/get
    fields: f43,f44,f45,f46,f47,f48,f57,f58,f60,f168,f169,f170,f171
    # 估值源（T04）：与行情同走 push2 stock/get，fields=估值列
    # f162→peTtm、f167→pb（语义推测，待多股实测确认）；f163/f173 待确认未纳入
    valuation-fields: f57,f162,f167
    # 财务源（T04）：东财 datacenter F10 主财务指标（与行情/估值不同域名）
    finance-url: https://datacenter-web.eastmoney.com/api/data/v1/get
    # 东财软限频来源页（无 token，靠 Referer 标识来源）
    finance-referer: https://data.eastmoney.com/
    # 公告源（T05）：东财 np-anotice-stock；ISSUE-A（2026-09-22）WAF 收紧，需 UA + 站内 Referer（此前"无需 Referer"结论失效）
    announce-url: https://np-anotice-stock.eastmoney.com/api/security/ann
    # 东财软限频来源页（与 datacenter 财务端同款）
    announce-referer: https://data.eastmoney.com/
    # 公告取数条数（PRD 取最新 3 条）
    announce-page-size: 3
    # 公告详情 PDF 直链模板（art_code 占位由 adapter 替换；H2_ 前缀已 A 股实测确认）
    announce-detail-url-template: https://pdf.dfcfw.com/pdf/H2_{art_code}_1.pdf
    # 全量列表源（T50 标的池定时同步）：push2 clist 分页拉取（ADR-0027 主选源）
    list-url: https://push2.eastmoney.com/api/qt/clist/get
  # 腾讯行情源（ADR-0031）：qt.gtimg.cn/q= 行情/估值备选——GBK 响应、支持批量（≤50/请求），
  # 无 UA/WAF 要求；auto 模式下东财 push2 失败/空响应（IP 封禁签名）自动降级此端点重拉
  tencent:
    quote-url: https://qt.gtimg.cn/q=
  # 行情/估值源选择（ADR-0031）：auto（默认）东财失败或空响应自动降级腾讯备选源重拉 /
  # eastmoney / tencent 强制单源（排障用——验证降级逻辑是否为故障源）；配置笔误启动 fail-fast
  quote-source: auto
  valuation-source: auto
  # 新浪新闻源（T06）：feed.mix.sina.com.cn 滚动新闻全市场流（不支持个股过滤，靠关键词匹配）
  # lid=2510 财经滚动分类（2026-09-21 curl 实测可用；1685~1689 已失效 code:11）；需 UA+Referer 防封 403
  sina:
    news-url: https://feed.mix.sina.com.cn/api/roll/get
    news-page-id: 153
    news-lid: 2510
    # 全市场流取数条数（本地按标题/关键词匹配过滤，num 越大命中率越高但耗时略增）
    news-page-size: 20
    news-referer: https://finance.sina.com.cn
  # 政策源（T07）：gov.cn/zhengce 政策库 HTML 抓取（6 源中唯一无统一 API 的源，Jsoup 解析）
  # 2026-09-21 curl 实测：响应头 Content-Type: text/html 无 charset，meta 声明 utf-8
  # 政策列表唯一块在「最新政策」节（div.list.fl>ul>li），约 9 条最近政策；无行业分类标签，靠标题关键词命中
  gov:
    policy-url: https://www.gov.cn/zhengce/
    # 软限频/防封：需 UA + Referer（gov.cn 对裸 curl 较宽松，仍带 UA+Referer 保险）
    policy-referer: https://www.gov.cn/

# 聚合编排总超时（2s 预算，各 adapter 弹性超时级联收敛，对齐技术方案 §4.3 流程 1）
aggregation:
  detail-timeout-millis: 2000

# 异动检测引擎（T13，§4.3 流程 3 + ADR-0006）：@Scheduled 每 10s 轮询活跃 watchlist_item，
# 行情涨跌幅 >= 阈值 → 业务键去重入库 → 发 Spring AnomalyDetectedEvent → T14 PushService 推送。
# detect.enabled=false 时调度与 Job 均不装配（测试 profile 默认关，避免 @SpringBootTest 触发轮询）。
anomaly:
  detect:
    enabled: true
  detect-interval-millis: 10000

# 推送补推 job（T15，§4.3 流程 3「断线靠 history 补拉」+ 重启恢复）：@Scheduled 每 30s 扫
# anomaly_event pushed=0（重启未消费异动，复用 PushService 全链路补推）与 push_record status=0
# （离线待推，在线补推/离线跳过/失败重试1次仍失败 status=2 告警）。
# retry.enabled=false 时 Job 不装配（测试 profile 关）；@EnableScheduling 复用 AnomalySchedulingConfig。
push:
  retry:
    enabled: true
    interval-millis: 30000
    # P1-1 后端半段（系统体检 20260924）：待推扫描有界化——scan-limit 单轮上限（防无界全量拉取）；
    # pending-retention-days 保留期（超期 PENDING 跳过不再扫/不再补拉，前端未接 SSE 期间的积压止血；SSE 前端接入后可调大）。
    scan-limit: 100
    pending-retention-days: 7
  sse:
    # 心跳帧间隔（系统体检 20260924 O8）：周期发 SSE comment 帧防中间层静默掐断空闲连接；
    # comment 帧前端 onmessage 不触发，不污染事件流；非正值关闭心跳。
    heartbeat-interval-millis: 30000

# 每日推荐排序（T23，§4.1.6 + §4.3 流程 2 + Spike-2 §11.5）：briefType=4 盘前预热 + 按需触发。
# schedule.enabled=false（默认）时 @Scheduled 预热 Job 与 @EnableScheduling 均不装配（测试关，对齐 04 规范）；
# 生产置 true 后每日 09:00（cron 可配）对配置 user-ids 预热生成，使 GET /recommendations/daily 首请求命中幂等缓存直返。
# user-ids 逗号分隔，默认空（个人单用户配一个 user-id；多用户盘前预热待 WatchlistRepository 端口演进）。
# poll/max-wait：on-demand 首请求触发后轮询查询简报至终态的间隔与上限（默认 500ms / 30s，对齐 LLM 超时）。
# pool-metrics-timeout-millis（P1-5a，系统体检 20260924）：规则兜底/上下文装配的自选池逐标的取数总预算——
# 逐标的并行执行（aggregationExecutor 虚拟线程），超时未完成的标的按源降级归 0（修前串行 N 标的 × 每源 2s 累加）。
recommendation:
  schedule:
    enabled: false
    cron: "0 0 9 * * ?"
    user-ids: ""
  poll-interval-millis: 500
  max-wait-millis: 30000
  pool-metrics-timeout-millis: 2000

# 政策时事流（T24，§4.1.5 + PRD 故事 4）：PolicyFetchJob @Scheduled 复用 T07 GovPolicyClient
# 抓 gov.cn/zhengce 最近政策 → existsBySourceUrl 去重 → PolicyIndustryClassifier 标 related_industries → saveAll。
# fetch.enabled=false 时 Job 不装配（测试 profile 关，@Scheduled 不触发，对齐 04 测试规范）；
# 生产置 true，@EnableScheduling 复用 AnomalySchedulingConfig（与 T15 补推 job 同策略）。interval 默认 1h。
policy:
  fetch:
    enabled: true
    interval-millis: 3600000
  # 政策倾向 AI 判断（T28，§4.1.5 ai_tendency + §4.3 流程 2 + Spike-2 §11.6）：@Scheduled 批量扫
  # ai_tendency=0 的近期政策 → 调 T19 LlmGateway（briefType=3 政策解读模板）→ 解析 bias 填 1利好/2利空/3中性。
  # tendency.enabled=false 时 Job 与 @EnableScheduling 均不装配（测试关，@Scheduled 不触发，对齐 04 规范）；
  # 生产置 true，独立调度开关（不与 fetch 耦合）。interval 默认 30min（介于抓取 1h 之间，新入库条目下一轮即判）。
  # days 扫描时间窗（默认 7）；batch-size 单轮处理上限（控 LLM 成本，系统任务 userId=0 成本守卫跳过）。
  # max-attempts / retry-backoff-hours（P0-3 止血，系统体检 20260924）：判断失败留痕尝试次数，
  # 试满上限（默认 3 次）的条目保持未判不再扫；距上次尝试不足退避窗（默认 2h）不重试——
  # 防失败条目被 30min 轮询无限重试烧 LLM 预算（实测每条失败政策 ≈ 168 次真实调用/周）。
  tendency:
    enabled: true
    interval-millis: 1800000
    days: 7
    batch-size: 20
    max-attempts: 3
    retry-backoff-hours: 2

# 标的池定时同步（T50~T54，技术方案增补 §4.2 参数表）。
# 页间隔 600ms：实测 300~400ms 连续约 28 次触发 push2 IP 级封禁，86 页/轮取保守值（ADR-0027）；
# page-size 100 为服务端强制上限（实测 pz>100 仍只回 100 行）；max-pages 单桶防御上限（A股 56 页，3.5× 裕量）；
# batch-size 单市场事务内 INSERT OR IGNORE 分批行数（防 SQLite 长事务）。
# missing-streak-threshold（T52）：消失确认轮数阈值，达阈值停用 status 1→0（PRD 默认 3，Should 可配）。
# enabled/cron（T53）：job.SUBJECT_SYNC 种子来源（ManagedJob 收编；生产默认启用，每日 06:00 开市前完成，
# 与每日推荐 09:00 同口径服务器本地时区；测试 profile 置 false → 调度零注册隔离）。
# index-enabled（T54）：CN_INDEX 指数桶开关（fs=m:1+t:1,m:0+t:5 上证+深证系列，Should；失败仅 WARN 不阻塞股票同步）。
# a-share-source（M7 备选源，ADR-0030）：A 股桶列表源选择——auto（默认）东财失败自动降级新浪整桶重拉 /
# eastmoney / sina（强制单源，排障用）；港股/指数桶恒东财（新浪无港股节点）。
subject:
  sync:
    page-size: 100
    # 页间隔加大到 1.5s：东财 WAF 对密集请求 IP 封禁（实测 ~30 次密集触发），一轮 86 页需更保守
    page-interval-millis: 1500
    max-pages: 200
    batch-size: 500
    missing-streak-threshold: 3
    enabled: true
    cron: "0 0 6 * * ?"
    index-enabled: true
    a-share-source: auto

# LLM 模型参数（provider/模型/单价/预算/超时/缓存 TTL 等）不在本文件——页面配置为唯一真相（runtime_config DB 持久化，
# 首启由 LlmDefaults 代码内置缺省播种，ADR-0017/0020）；API key 环境变量（DEEPSEEK_API_KEY 等）仍为一等来源（ADR-0018）。
