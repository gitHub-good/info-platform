spring:
  application:
    name: info-platform-backend
  datasource:
    url: jdbc:sqlite:file:./data/info-platform.db
    driver-class-name: org.sqlite.JDBC
    hikari:
      # SQLite 单写者模型：小池即可（1~5），写靠排队不靠加池
      maximum-pool-size: 5
      # 连接即开三件 PRAGMA：WAL（读写不互斥）/ 外键默认关需显式开 / 写锁等待 5s
      connection-init-sql: "PRAGMA journal_mode=WAL;PRAGMA foreign_keys=ON;PRAGMA busy_timeout=5000;"
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

# MyBatis-Plus 配置
mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      id-type: AUTO

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info
