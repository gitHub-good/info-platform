# 测试环境：SQLite 共享内存库（每个 JVM 进程一份，进程结束即销毁，无文件残留）
spring:
  application:
    name: info-platform-backend-test
  datasource:
    # cache=shared 让同一进程内多连接共享同一内存库，Flyway 建表后测试可见
    # 内存库无 WAL 概念，仅开外键（URL 参数方式，与主配置一致）
    url: jdbc:sqlite:file::memory:?cache=shared&foreign_keys=on
    driver-class-name: org.sqlite.JDBC
    hikari:
      maximum-pool-size: 2
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      id-type: AUTO

# 异动检测调度在测试环境关闭：@Scheduled 不在 @SpringBootTest 触发，
# 异动逻辑改由单测直接调 detectForItem 验证（对齐 04 测试规范）。
anomaly:
  detect:
    enabled: false

# 补推 job 在测试环境关闭：@Scheduled 不触发（对齐 04 测试规范），
# 补推逻辑改由单测直接调 recoverPendingAnomalies / retryPendingRecords 验证。
push:
  retry:
    enabled: false

# 每日推荐盘前预热 job 在测试环境关闭：@Scheduled 不触发（对齐 04 测试规范），
# 每日推荐逻辑改由单测直接调 DailyRecommendationService.generateDaily 验证。
recommendation:
  schedule:
    enabled: false

# 政策抓取 job 在测试环境关闭：@Scheduled 不触发、PolicyFetchJob 不装配（对齐 04 测试规范），
# 抓取/去重逻辑改由单测直接调 PolicyFetchJob.fetch 验证（mock GovPolicyClient，不依赖真实 gov.cn）。
policy:
  fetch:
    enabled: false
  # 政策倾向判断 job 在测试环境关闭：@Scheduled 不触发、PolicyTendencyJob 不装配（对齐 04 测试规范），
  # 倾向判断逻辑改由单测直接调 PolicyTendencyService.judgeTendency 验证（mock LlmGateway，不依赖真实 LLM）。
  tendency:
    enabled: false

logging:
  level:
    org.springframework: WARN
    com.info.platform: DEBUG
