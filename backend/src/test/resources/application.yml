# 测试环境：SQLite 共享内存库（每个 JVM 进程一份，进程结束即销毁，无文件残留）
spring:
  application:
    name: info-platform-backend-test
  datasource:
    # cache=shared 让同一进程内多连接共享同一内存库，Flyway 建表后测试可见
    # 内存库无 WAL 概念，仅开外键（URL 参数方式，与主配置一致）
    url: jdbc:sqlite:file::memory:?cache=shared&foreign_keys=on
    driver-class-name: org.sqlite.JDBC
    hikari:
      maximum-pool-size: 2
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      id-type: AUTO

# 异动检测调度在测试环境关闭：@Scheduled 不在 @SpringBootTest 触发，
# 异动逻辑改由单测直接调 detectForItem 验证（对齐 04 测试规范）。
anomaly:
  detect:
    enabled: false

# 补推 job 在测试环境关闭：@Scheduled 不触发（对齐 04 测试规范），
# 补推逻辑改由单测直接调 recoverPendingAnomalies / retryPendingRecords 验证。
push:
  retry:
    enabled: false

# 每日推荐盘前预热 job 在测试环境关闭：@Scheduled 不触发（对齐 04 测试规范），
# 每日推荐逻辑改由单测直接调 DailyRecommendationService.generateDaily 验证。
recommendation:
  schedule:
    enabled: false
  # 推荐事件消费 job 在测试环境关闭：种子 job.RECOMMENDATION_FEED enabled=false → 调度零注册（M16 T133，十四 Job 惯例）；
  # 消费/闸门逻辑改由单测直接调 RecommendationFeedService.tick / RecommendationPushGate.run 验证（LLM 全 Mock 零外呼）。
  feed:
    enabled: false
    interval-millis: 60000

# 政策双轨 Job 已随 V2.3-M23 T203 整链删除（ADR-0062 裁决二）：政策条目走资讯源体系（gov_policy 目录源
# 经 SOURCE_POLL 轮询），该源的测试隔离由 source.poll.enabled=false 覆盖；无独立 yml 键。

# 标的池同步 job 在测试环境关闭：种子 job.SUBJECT_SYNC enabled=false → 调度中心零注册（@Scheduled 等价隔离），
# 同步逻辑改由单测/集成测试直接调 SubjectSyncService 验证（mock 列表源，不真实外呼 push2）；
# cron/threshold 等其余参数继承主 application.yml（种子形态断言用）。
subject:
  sync:
    enabled: false

# 留痕清理 job 在测试环境关闭：种子 job.RETENTION_CLEANUP enabled=false → 调度中心零注册（M10 T71，对齐六 Job 惯例）；
